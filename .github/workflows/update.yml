# Weekly biotech funding tracker
# File must live at:  .github/workflows/update.yml
name: Weekly funding tracker

on:
  schedule:
    - cron: "17 13 * * 1"  # Mondays 13:17 UTC (~9:17 AM ET), after NIH's Sunday-night refresh
  workflow_dispatch: {}     # manual run button stays available

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          # Optional: a free NCBI API key speeds up the PubMed email fallback.
          # Add it under Settings > Secrets and variables > Actions as NCBI_API_KEY.
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python funding_tracker.py

      - name: Commit updated ledger and page
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly funding update"
          file_pattern: "data/* docs/*"
